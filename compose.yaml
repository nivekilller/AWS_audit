services:
  localstack:
    image: localstack/localstack:4.12
    container_name: localstack-local
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ec2,iam
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-app:
    build: .
    container_name: aws-audit-runner
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - .:/app
    command: python run_scan.py